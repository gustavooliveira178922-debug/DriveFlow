name: driveflow
description: A native Telegram-powered personal cloud file manager.
publish_to: none
version: 1.0.11+12

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  file_picker: ^8.1.7
  desktop_drop: ^0.7.1
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
