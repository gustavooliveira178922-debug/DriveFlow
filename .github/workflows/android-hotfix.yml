name: Android APK rebuild

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing DriveFlow release version to complete (for example 1.0.10)
        required: true
        type: string
        default: 1.0.10
      source_run:
        description: Successful Windows/macOS artifact run ID
        required: true
        type: string
        default: "40990037516"

permissions:
  contents: write
  actions: read

jobs:
  android-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Build TDLib JSON libraries
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gperf php-cli perl ninja-build
          sdkmanager "platforms;android-34" "platforms;android-36" "cmake;3.22.1"
          td="$RUNNER_TEMP/tdlib-src"
          git init "$td"
          git -C "$td" remote add origin https://github.com/tdlib/td.git
          git -C "$td" fetch --depth 1 origin 0e88653dcbf4e44c73cb655a05b58cd749a91169
          git -C "$td" checkout --detach FETCH_HEAD
          cd "$td/example/android"
          # DriveFlow ships arm64, 32-bit ARM and x86_64; skip unused x86 to cut build time.
          sed -i 's/for ABI in arm64-v8a armeabi-v7a x86_64 x86 ;/for ABI in arm64-v8a armeabi-v7a x86_64 ;/' build-openssl.sh
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          ./build-openssl.sh "$ANDROID_SDK_ROOT" 27.2.12479018 third-party/openssl openssl-3.3.0
          ./build-tdlib.sh "$ANDROID_SDK_ROOT" 27.2.12479018 third-party/openssl c++_static JSON 21 "arm64-v8a armeabi-v7a x86_64"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "$GITHUB_WORKSPACE/apps/flutter_app/android/app/src/main/jniLibs/$abi"
            cp "tdlib/libs/$abi/libtdjson.so" "$GITHUB_WORKSPACE/apps/flutter_app/android/app/src/main/jniLibs/$abi/"
          done
      - name: Generate Android runner and fetch packages
        working-directory: apps/flutter_app
        shell: bash
        run: |
          flutter create --project-name driveflow --platforms=windows,macos,android .
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((path for path in candidates if path.exists()), None)
          if gradle is None:
              raise SystemExit("Flutter did not generate the Android app Gradle file")
          text = gradle.read_text()
          updated = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", text)
          updated = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 36", updated)
          if updated == text and not re.search(r"compileSdk(?:Version)?\s*(?:=\s*)?36\b", text):
              raise SystemExit("Could not set compileSdk to Android 36")
          gradle.write_text(updated)
          PY
          rm -f test/widget_test.dart
      - name: Build Android Rust libraries
        working-directory: core/rust
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../apps/flutter_app/android/app/src/main/jniLibs build --release
      - name: Build universal APK
        working-directory: apps/flutter_app
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: flutter build apk --release --dart-define=TELEGRAM_API_ID=$TELEGRAM_API_ID --dart-define=TELEGRAM_API_HASH=$TELEGRAM_API_HASH
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run }}
          name: windows-installer
          path: release-assets/windows-installer
      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run }}
          name: macos-dmg
          path: release-assets/macos-dmg
      - name: Name release assets
        shell: bash
        run: |
          version="${{ inputs.release_version }}"
          mkdir -p release
          find "release-assets/windows-installer" -name '*.exe' -exec cp {} "release/DriveFlow-Setup-v${version}-x64.exe" \;
          find "release-assets/macos-dmg" -name '*.dmg' -exec cp {} "release/DriveFlow-macOS-v${version}.dmg" \;
          cp "apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk" "release/DriveFlow-Android-v${version}-release.apk"
          test -f "release/DriveFlow-Setup-v${version}-x64.exe"
          test -f "release/DriveFlow-macOS-v${version}.dmg"
      - name: Publish completed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.release_version }}
          target_commitish: main
          files: release/*
          fail_on_unmatched_files: true
