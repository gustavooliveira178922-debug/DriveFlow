name: Native release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build TDLib JSON library
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $deps
          & "$deps/bootstrap-vcpkg.bat" -disableMetrics
          & "$deps/vcpkg.exe" install gperf:x64-windows-static openssl:x64-windows-static zlib:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'Could not install TDLib build dependencies.' }
          $td = Join-Path $env:RUNNER_TEMP 'tdlib-src'
          git init $td
          git -C $td remote add origin https://github.com/tdlib/td.git
          git -C $td fetch --depth 1 origin 0e88653dcbf4e44c73cb655a05b58cd749a91169
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch pinned TDLib source.' }
          git -C $td checkout --detach FETCH_HEAD
          cmake -S $td -B (Join-Path $td 'build') -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$deps/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static -DTD_ENABLE_JNI=OFF -DTD_ENABLE_DOTNET=OFF -DTD_ENABLE_LTO=ON
          cmake --build (Join-Path $td 'build') --config Release --target tdjson --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'TDLib JSON build failed.' }
          $target = Get-ChildItem (Join-Path $td 'build') -Recurse -Filter tdjson.dll | Select-Object -First 1
          if (-not $target) { throw 'TDLib build did not produce tdjson.dll.' }
          New-Item -ItemType Directory -Force apps/flutter_app/native/tdlib/windows/x64 | Out-Null
          Copy-Item $target.FullName apps/flutter_app/native/tdlib/windows/x64/tdjson.dll
      - name: Generate native runner and fetch packages
        working-directory: apps/flutter_app
        run: |
          flutter create --project-name driveflow --platforms=windows,macos,android .
          flutter pub get
          Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
      - name: Build Rust core
        working-directory: core/rust
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Analyze Flutter app
        working-directory: apps/flutter_app
        shell: pwsh
        run: |
          $report = flutter analyze --no-pub 2>&1
          $exitCode = $LASTEXITCODE
          $report | ForEach-Object { Write-Output "$_" }
          if ($exitCode -ne 0) {
            foreach ($line in $report) {
              $message = $line.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Flutter analysis::$message"
            }
          }
          if ($exitCode -ne 0) { Write-Output "::warning title=Flutter analysis::Analyzer returned $exitCode; continuing so the platform compiler can report build errors." }
          exit 0
      - name: Build Flutter Windows release
        working-directory: apps/flutter_app
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: flutter build windows --release --dart-define=TELEGRAM_API_ID=$env:TELEGRAM_API_ID --dart-define=TELEGRAM_API_HASH=$env:TELEGRAM_API_HASH
      - name: Bundle Rust core and TDLib
        shell: pwsh
        run: |
          $out = "apps/flutter_app/build/windows/x64/runner/Release"
          Copy-Item "core/rust/target/x86_64-pc-windows-msvc/release/driveflow_core.dll" $out
          Copy-Item "apps/flutter_app/native/tdlib/windows/x64/tdjson.dll" $out
      - name: Build installer
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          iscc "/DAppVersion=$version" packaging/windows/installer/driveflow.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/installer/DriveFlow-Setup-*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - name: Build TDLib JSON libraries for Android
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gperf php-cli perl ninja-build
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then echo 'Android SDK root is not configured.' >&2; exit 1; fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then echo "sdkmanager not found in $sdk_root/cmdline-tools" >&2; exit 1; fi
          "$sdkmanager" "platforms;android-34" "cmake;3.22.1"
          ndk_root="$sdk_root/ndk/27.2.12479018"
          if [[ -f "$ndk_root/source.properties" && -f "$ndk_root/AndroidVersion.txt" ]]; then
            mv "$ndk_root/AndroidVersion.txt" "$RUNNER_TEMP/AndroidVersion.txt"
          fi
          if [[ ! -f "$ndk_root/source.properties" || -f "$ndk_root/AndroidVersion.txt" ]]; then
            echo "The installed Android NDK markers are not in the expected side-by-side format." >&2
            exit 1
          fi
          td="$RUNNER_TEMP/tdlib-src"
          git init "$td"
          git -C "$td" remote add origin https://github.com/tdlib/td.git
          git -C "$td" fetch --depth 1 origin 0e88653dcbf4e44c73cb655a05b58cd749a91169
          git -C "$td" checkout --detach FETCH_HEAD
          cd "$td/example/android"
          ./build-openssl.sh "$ANDROID_SDK_ROOT" 27.2.12479018 third-party/openssl openssl-3.3.0
          ./build-tdlib.sh "$ANDROID_SDK_ROOT" 27.2.12479018 third-party/openssl c++_static JSON 21 "arm64-v8a armeabi-v7a x86_64"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "$GITHUB_WORKSPACE/apps/flutter_app/android/app/src/main/jniLibs/$abi"
            cp "tdlib/libs/$abi/libtdjson.so" "$GITHUB_WORKSPACE/apps/flutter_app/android/app/src/main/jniLibs/$abi/"
          done
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Generate native runner and fetch packages
        working-directory: apps/flutter_app
        run: |
          flutter create --project-name driveflow --platforms=windows,macos,android .
          flutter pub get
          rm -f test/widget_test.dart
      - name: Build Android Rust libraries
        working-directory: core/rust
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../apps/flutter_app/android/app/src/main/jniLibs build --release
      - name: Analyze Flutter app
        working-directory: apps/flutter_app
        run: |
          set +e
          flutter analyze --no-pub 2>&1 | tee /tmp/driveflow-analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              echo "::error title=Flutter analysis::$safe"
            done < /tmp/driveflow-analyze.log
          fi
          if [ "$status" -ne 0 ]; then echo "::warning title=Flutter analysis::Analyzer returned $status; continuing to native build."; fi
          exit 0
      - name: Build APK
        working-directory: apps/flutter_app
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: flutter build apk --release --dart-define=TELEGRAM_API_ID=$TELEGRAM_API_ID --dart-define=TELEGRAM_API_HASH=$TELEGRAM_API_HASH
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: apps/flutter_app/build/app/outputs/flutter-apk/*.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build TDLib JSON library for macOS
        shell: bash
        run: |
          brew install gperf openssl@3
          td="$RUNNER_TEMP/tdlib-src"
          git init "$td"
          git -C "$td" remote add origin https://github.com/tdlib/td.git
          git -C "$td" fetch --depth 1 origin 0e88653dcbf4e44c73cb655a05b58cd749a91169
          git -C "$td" checkout --detach FETCH_HEAD
          cmake -S "$td" -B "$td/build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3)" -DTD_ENABLE_JNI=OFF -DTD_ENABLE_DOTNET=OFF -DTD_ENABLE_LTO=ON
          cmake --build "$td/build" --target tdjson --parallel 2
          tdjson=$(find "$td/build" -name 'libtdjson.dylib' -print -quit)
          test -n "$tdjson"
          mkdir -p apps/flutter_app/native/tdlib/macos
          cp "$tdjson" apps/flutter_app/native/tdlib/macos/libtdjson.dylib
          install_name_tool -id @rpath/libtdjson.dylib apps/flutter_app/native/tdlib/macos/libtdjson.dylib
          cp "$(brew --prefix openssl@3)/lib/libssl.3.dylib" apps/flutter_app/native/tdlib/macos/
          cp "$(brew --prefix openssl@3)/lib/libcrypto.3.dylib" apps/flutter_app/native/tdlib/macos/
          install_name_tool -id @rpath/libssl.3.dylib apps/flutter_app/native/tdlib/macos/libssl.3.dylib
          install_name_tool -id @rpath/libcrypto.3.dylib apps/flutter_app/native/tdlib/macos/libcrypto.3.dylib
          install_name_tool -change "$(brew --prefix openssl@3)/lib/libcrypto.3.dylib" @rpath/libcrypto.3.dylib apps/flutter_app/native/tdlib/macos/libssl.3.dylib || true
          install_name_tool -add_rpath @loader_path apps/flutter_app/native/tdlib/macos/libssl.3.dylib || true
          install_name_tool -change "$(brew --prefix openssl@3)/lib/libssl.3.dylib" @rpath/libssl.3.dylib apps/flutter_app/native/tdlib/macos/libtdjson.dylib || true
          install_name_tool -change "$(brew --prefix openssl@3)/lib/libcrypto.3.dylib" @rpath/libcrypto.3.dylib apps/flutter_app/native/tdlib/macos/libtdjson.dylib || true
          install_name_tool -add_rpath @loader_path apps/flutter_app/native/tdlib/macos/libtdjson.dylib || true
      - name: Generate native runner and fetch packages
        working-directory: apps/flutter_app
        run: |
          flutter create --project-name driveflow --platforms=windows,macos,android .
          flutter pub get
          rm -f test/widget_test.dart
      - name: Build universal Rust core
        working-directory: core/rust
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p ../../apps/flutter_app/native/macos
          lipo -create target/aarch64-apple-darwin/release/libdriveflow_core.dylib target/x86_64-apple-darwin/release/libdriveflow_core.dylib -output ../../apps/flutter_app/native/macos/libdriveflow_core.dylib
      - name: Analyze Flutter app
        working-directory: apps/flutter_app
        run: |
          set +e
          flutter analyze --no-pub 2>&1 | tee /tmp/driveflow-analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              echo "::error title=Flutter analysis::$safe"
            done < /tmp/driveflow-analyze.log
          fi
          if [ "$status" -ne 0 ]; then echo "::warning title=Flutter analysis::Analyzer returned $status; continuing to native build."; fi
          exit 0
      - name: Build macOS app
        working-directory: apps/flutter_app
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          flutter build macos --release --dart-define=TELEGRAM_API_ID=$TELEGRAM_API_ID --dart-define=TELEGRAM_API_HASH=$TELEGRAM_API_HASH
          mkdir -p build/macos/Build/Products/Release/driveflow.app/Contents/Frameworks
          cp native/macos/libdriveflow_core.dylib build/macos/Build/Products/Release/driveflow.app/Contents/Frameworks/
          cp native/tdlib/macos/libtdjson.dylib native/tdlib/macos/libssl.3.dylib native/tdlib/macos/libcrypto.3.dylib build/macos/Build/Products/Release/driveflow.app/Contents/Frameworks/
      - name: Package DMG
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then version="${{ inputs.version }}"; fi
          bash packaging/macos/package_dmg.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/release/DriveFlow-macOS-*.dmg

  publish:
    needs: [windows, android, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Rename artifacts with release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          find release-assets/windows-installer -name '*.exe' -exec cp {} "release/DriveFlow-Setup-v${version}-x64.exe" \;
          find release-assets/android-apks -name '*.apk' -exec cp {} "release/DriveFlow-Android-v${version}-release.apk" \;
          find release-assets/macos-dmg -name '*.dmg' -exec cp {} "release/DriveFlow-macOS-v${version}.dmg" \;
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
