name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing release to attach the Android APK to
        required: true
        type: string
        default: 1.0.10

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Build TDLib JSON libraries
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gperf php-cli perl ninja-build
          sdkmanager "platforms;android-34" "platforms;android-36" "cmake;3.22.1"
          td="$RUNNER_TEMP/tdlib-src"
          git init "$td"
          git -C "$td" remote add origin https://github.com/tdlib/td.git
          git -C "$td" fetch --depth 1 origin 0e88653dcbf4e44c73cb655a05b58cd749a91169
          git -C "$td" checkout --detach FETCH_HEAD
          cd "$td/example/android"
          # DriveFlow packages arm64, 32-bit ARM and x86_64, so skip unused x86.
          sed -i 's/for ABI in arm64-v8a armeabi-v7a x86_64 x86 ;/for ABI in arm64-v8a armeabi-v7a x86_64 ;/' build-openssl.sh
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          ./build-openssl.sh "$ANDROID_SDK_ROOT" 27.2.12479018 third-party/openssl openssl-3.3.0
          ./build-tdlib.sh "$ANDROID_SDK_ROOT" 27.2.12479018 third-party/openssl c++_static JSON 21 "arm64-v8a armeabi-v7a x86_64"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "$GITHUB_WORKSPACE/apps/flutter_app/android/app/src/main/jniLibs/$abi"
            cp "tdlib/libs/$abi/libtdjson.so" "$GITHUB_WORKSPACE/apps/flutter_app/android/app/src/main/jniLibs/$abi/"
          done
      - name: Generate Android runner and fetch packages
        working-directory: apps/flutter_app
        shell: bash
        run: |
          flutter create --project-name driveflow --platforms=windows,macos,android .
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((path for path in candidates if path.exists()), None)
          if gradle is None:
              raise SystemExit("Flutter did not generate the Android app Gradle file")
          text = gradle.read_text()
          updated = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", text)
          updated = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 36", updated)
          if updated == text and not re.search(r"compileSdk(?:Version)?\s*(?:=\s*)?36\b", text):
              raise SystemExit("Could not set compileSdk to Android 36")
          gradle.write_text(updated)
          PY
          rm -f test/widget_test.dart
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build Rust core for Android
        working-directory: core/rust
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../apps/flutter_app/android/app/src/main/jniLibs build --release
      - name: Build release APK
        working-directory: apps/flutter_app
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: flutter build apk --release --dart-define=TELEGRAM_API_ID=$TELEGRAM_API_ID --dart-define=TELEGRAM_API_HASH=$TELEGRAM_API_HASH
      - name: Name APK
        shell: bash
        run: |
          mkdir -p release
          cp apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk "release/DriveFlow-Android-v${{ inputs.release_version }}-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/DriveFlow-Android-v${{ inputs.release_version }}-release.apk
      - name: Attach APK to existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.release_version }}
          target_commitish: main
          files: release/DriveFlow-Android-v${{ inputs.release_version }}-release.apk
          fail_on_unmatched_files: true
          overwrite_files: true
