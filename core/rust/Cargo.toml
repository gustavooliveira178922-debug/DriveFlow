[package]
name = "driveflow-core"
version = "1.0.11"
edition = "2021"
license = "MIT"
description = "Native Rust core for DriveFlow"

[lib]
name = "driveflow_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
chacha20poly1305 = "0.10"
libloading = "0.8"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
